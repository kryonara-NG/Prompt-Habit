name: Prompt Habit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prompt-habit-dist
          path: dist
          if-no-files-found: error

  vercel-deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_b3r4mfO4SelAAz8JZ0uezpom
      VERCEL_PROJECT_ID: prj_OI0TLd8qEpPdeiNpXPMPLZolv9M3
    steps:
      - name: Check Vercel deployment credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.credentials.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.credentials.outputs.available == 'true'
        run: npm install

      - name: Install Vercel CLI
        if: steps.credentials.outputs.available == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel production settings
        if: steps.credentials.outputs.available == 'true'
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        if: steps.credentials.outputs.available == 'true'
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy production artifact
        if: steps.credentials.outputs.available == 'true'
        run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - name: Deployment credential note
        if: steps.credentials.outputs.available != 'true'
        run: echo "Vercel CLI deployment is idle until VERCEL_TOKEN is configured."
